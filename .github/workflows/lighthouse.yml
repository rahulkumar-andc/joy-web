name: Lighthouse Performance Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server
        run: |
          npm start &
          sleep 10
        env:
          NODE_ENV: production
          SESSION_SECRET: lighthouse-ci-test-secret-key

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:5000/api/health && break
            echo "Waiting for server... attempt $i"
            sleep 2
          done

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5000/
            http://localhost:5000/products
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check Lighthouse Scores
        run: |
          echo "📊 Lighthouse Results"
          echo "===================="
          
          # Parse scores from Lighthouse output
          PERF_SCORE=$(echo '${{ steps.lighthouse.outputs.manifest }}' | jq -r '.[0].summary.performance * 100 | floor')
          SEO_SCORE=$(echo '${{ steps.lighthouse.outputs.manifest }}' | jq -r '.[0].summary.seo * 100 | floor')
          A11Y_SCORE=$(echo '${{ steps.lighthouse.outputs.manifest }}' | jq -r '.[0].summary.accessibility * 100 | floor')
          BP_SCORE=$(echo '${{ steps.lighthouse.outputs.manifest }}' | jq -r '.[0].summary["best-practices"] * 100 | floor')
          
          echo "Performance: $PERF_SCORE"
          echo "SEO: $SEO_SCORE"
          echo "Accessibility: $A11Y_SCORE"
          echo "Best Practices: $BP_SCORE"
          
          # Fail if Performance score is below 80
          if [ "$PERF_SCORE" -lt 80 ]; then
            echo "❌ Performance score ($PERF_SCORE) is below threshold (80)"
            exit 1
          fi
          
          echo "✅ All performance checks passed!"

      - name: Comment PR with Lighthouse Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = ${{ steps.lighthouse.outputs.manifest }};
            const summary = manifest[0].summary;
            
            const formatScore = (score) => {
              const pct = Math.round(score * 100);
              const emoji = pct >= 90 ? '🟢' : pct >= 80 ? '🟡' : '🔴';
              return `${emoji} ${pct}`;
            };
            
            const body = `## 🔦 Lighthouse Report
            
            | Metric | Score |
            |--------|-------|
            | Performance | ${formatScore(summary.performance)} |
            | Accessibility | ${formatScore(summary.accessibility)} |
            | Best Practices | ${formatScore(summary['best-practices'])} |
            | SEO | ${formatScore(summary.seo)} |
            
            [View full report](${manifest[0].url})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
