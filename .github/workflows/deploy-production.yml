name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: production  # Requires approval in GitHub settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (safety check)
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to PRODUCTION environment..."
          echo "⚠️  This is a production deployment!"
          echo "Note: Add actual deployment commands here"
        # Add production deployment commands
        # Example deployment methods commented below

      - name: Run database migrations
        run: |
          echo "Running production migrations..."
          # npm run migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🎉 Live at: https://your-domain.com"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ CRITICAL: Production deployment failed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Initiating rollback..."
          # Add rollback commands here
